name: Coursework CI
on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run unit tests
        run: mvn -Dtest=Coursework.AppTest,Coursework.ReportManagerTest test

  IntegrationTests:
    name: Integration Tests (world-db)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Spin up the world DB container from your db/ folder
      - name: Build DB image
        run: docker build -t worlddb ./db
      - name: Run DB container
        run: docker run -d --name world-db -p 33060:3306 worlddb

      - name: Run integration tests
        run: mvn -Dtest=Coursework.AppIntegrationTest test

     
      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./target/site/jacoco
          verbose: true
        env:
          # For private repos, add a repo secret named CODECOV_TOKEN and keep the line below.
          # For public repos, Codecov usually works without a token—leaving this set is harmless
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop & clean DB container
        if: always()
        run: |
          docker stop world-db
          docker rm world-db
          docker image rm worlddb

  BuildCompose:
    name: Build app with docker-compose
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Package app
        run: mvn package -DskipTests
      - name: Compose up (exit when app exits)
        run: docker compose up --abort-on-container-exit

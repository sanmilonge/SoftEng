name: Coursework CI
on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'          # matches your local run in screenshot
          distribution: 'temurin'
      - name: Run unit tests
        run: mvn -Dtest=Coursework.AppTest test
        # or run them all: mvn test

  IntegrationTests:
    name: Integration Tests (world-db)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Spin up the world DB container from your db/ folder
      - name: Build DB image
        run: docker build -t worlddb ./db
      - name: Run DB container
        run: docker run -d --name world-db -p 33060:3306 worlddb

      - name: Run integration tests
        run: mvn -Dtest=Coursework.AppIntegrationTest test

      - name: Stop & clean DB container
        if: always()
        run: |
          docker stop world-db
          docker rm world-db
          docker image rm worlddb
  BuildCompose:
    name: Build app with docker-compose
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Package app
        run: mvn package -DskipTests
      - name: Compose up (exit when app exits)
        run: docker compose up --abort-on-container-exit

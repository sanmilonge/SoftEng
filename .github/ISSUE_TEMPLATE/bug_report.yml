name: Bug Report
description: File a bug report for the Coursework application
title: "[BUG]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Describe the issue

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a detailed description of the bug.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the steps we can use to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stacktrace
      render: shell
      placeholder: Paste logs here

  - type: input
    id: version
    attributes:
      label: App version or commit hash
      placeholder: 1.0.0 or commit SHA
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: false
      options:
        - Local machine
        - GitHub Actions
        - Docker Compose
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: Add any extra details here

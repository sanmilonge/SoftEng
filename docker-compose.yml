version: "3.8"

services:
  db:
    build: ./db
    container_name: imran-db-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: world
    ports:
      - "33060:3306"   # host:container (your existing port)
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: cw-app
    depends_on:
      - db
    environment:
      CI: ${CI:-false}
    volumes:
      # Mount reports folder from host so reports are visible locally
      - ./src/main/resources/reports:/app/src/main/resources/reports
    command: ["java", "-jar", "devops.jar", "db:3306", "30000"]

volumes:
  db_data: